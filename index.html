<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>COMPASSION WORLD 本館 チェックイン</title>
  <link rel="preload" as="image" href="assets/avatar-female-tablet.png">
  <link rel="preload" as="image" href="assets/avatar-male-tablet-v2.png">
  <style>
    :root {
      --viewport-height: 100vh;
      --cream: #f7f0e3;
      --cream-deep: #eadcc8;
      --panel: rgba(255, 253, 248, .95);
      --brown: #5b4432;
      --muted: #806e5e;
      --green: #668a5b;
      --green-dark: #4f7148;
      --green-soft: #e7f0e2;
      --error: #a85644;
      --shadow: 0 22px 55px rgba(91, 68, 50, .14);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      height: 100vh;
      height: 100dvh;
      height: var(--viewport-height);
      padding: 18px;
      color: var(--brown);
      background: radial-gradient(circle at 50% 0, #fffaf1 0, var(--cream) 58%, #ebdfcf 100%);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      overscroll-behavior: none;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1100px, 100%);
      height: calc(100vh - 36px);
      height: calc(100dvh - 36px);
      height: calc(var(--viewport-height) - 36px);
      margin: 0 auto;
      padding: 22px;
      overflow: hidden;
      border: 1px solid rgba(121, 91, 62, .14);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .brand { text-align: center; }
    .brand h1 { margin: 0; font-size: clamp(23px, 3vw, 34px); letter-spacing: .08em; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    .screen { display: none; min-height: 0; }
    .screen.active { display: grid; }

    #homeScreen {
      grid-template-columns: minmax(220px, .8fr) minmax(420px, 1.35fr);
      gap: 24px;
      align-items: stretch;
      padding: 18px 0 8px;
    }

    .avatar-panel {
      min-height: 510px;
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(234, 220, 200, .55), rgba(255,255,255,.1));
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .avatar-stage {
      width: min(100%, 420px);
      height: calc(100% - 92px);
      margin-top: 92px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-origin: 50% 100%;
      animation: avatarIdle 5.2s ease-in-out infinite;
    }

    .avatar {
      width: 100%;
      height: auto;
      max-height: 500px;
      display: block;
      flex: 0 0 auto;
      filter: drop-shadow(0 14px 18px rgba(91,68,50,.13));
      transform-origin: 50% 100%;
    }

    @keyframes avatarIdle {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
      28% { transform: translate3d(-2px, -5px, 0) rotate(-.35deg) scale(1.006); }
      58% { transform: translate3d(2px, -2px, 0) rotate(.35deg) scale(1.002); }
      78% { transform: translate3d(0, -6px, 0) rotate(0deg) scale(1.008); }
    }
    .avatar-stage.speaking { animation-duration: 2.7s; }
    .avatar-stage.speaking .avatar { animation: speakingPulse .62s ease-in-out infinite alternate; }
    @keyframes speakingPulse { to { transform: translateY(-1px) scale(1.003); filter: saturate(1.035); } }

    .speech {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 2;
      padding: 15px 17px;
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 8px 24px rgba(91,68,50,.10);
      font-size: clamp(15px, 1.7vw, 19px);
      font-weight: 700;
      line-height: 1.65;
      text-align: center;
      animation: speechFloat 3.4s ease-in-out infinite;
    }
    @keyframes speechFloat { 50% { transform: translateY(-2px); } }

    .home-actions { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
    .lead { margin: 0 0 2px; text-align: center; font-size: clamp(22px, 3vw, 34px); line-height: 1.5; }
    .lead-sub { margin: 0 0 10px; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.7; }

    .choice {
      width: 100%;
      min-height: 108px;
      padding: 18px 22px;
      border: 0;
      border-radius: 22px;
      cursor: pointer;
      text-align: left;
      color: #fff;
      background: linear-gradient(180deg, #789b6d, var(--green));
      box-shadow: 0 11px 25px rgba(82,116,73,.22);
    }

    .choice.secondary {
      color: var(--brown);
      border: 2px solid rgba(111, 83, 56, .14);
      background: linear-gradient(180deg, #fff, #f4e9da);
      box-shadow: 0 10px 24px rgba(91,68,50,.10);
    }

    .choice strong { display: block; font-size: clamp(22px, 2.5vw, 30px); }
    .choice span { display: block; margin-top: 5px; font-size: 14px; opacity: .92; }

    #scanScreen, #guideScreen { place-items: center; padding: 20px 0 8px; }
    .card {
      width: min(760px, 100%);
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid rgba(111,83,56,.12);
      border-radius: 26px;
      background: rgba(255,255,255,.67);
      text-align: center;
    }

    .mini-avatar { height: 165px; max-width: 210px; object-fit: contain; margin: -10px auto 4px; }
    #guideAvatar {
      transform-origin: 50% 100%;
      animation: avatarIdle 5.2s ease-in-out infinite;
      filter: drop-shadow(0 12px 16px rgba(91,68,50,.10));
    }
    #guideAvatar.speaking { animation: guideSpeaking 1.35s ease-in-out infinite alternate; }
    @keyframes guideSpeaking {
      0% { transform: translate3d(-1px, 0, 0) rotate(-.2deg) scale(1); }
      100% { transform: translate3d(1px, -4px, 0) rotate(.2deg) scale(1.008); }
    }
    .message-main { margin: 0; white-space: pre-line; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.55; }
    .message-sub { min-height: 1.7em; margin: 10px 0 0; white-space: pre-line; color: var(--muted); line-height: 1.7; }
    .error-note { color: var(--error); }

    .progress-shell { width: min(460px, 100%); margin: 24px auto 0; }
    .progress-track { height: 17px; overflow: hidden; border-radius: 999px; background: #eadfce; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9ab48d, var(--green)); transition: width .12s linear; }
    .progress-num { margin-top: 9px; color: var(--green-dark); font-size: 27px; font-weight: 800; }

    .success-mark { display: none; width: 76px; height: 76px; margin: 16px auto; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); font-size: 48px; line-height: 76px; }
    .spinner { display: none; width: 58px; height: 58px; margin: 18px auto; border: 6px solid #e4d8c7; border-top-color: var(--green); border-radius: 50%; animation: spin .85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .terminal-kicker {
      width: fit-content;
      margin: 0 auto -8px;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .scanner-callout {
      min-height: 124px;
      padding: 16px 8px;
      border-top: 3px solid var(--green);
      border-bottom: 3px solid var(--green);
      background: transparent;
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
    }
    .scanner-icon {
      width: 62px;
      height: 62px;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: var(--green-dark);
      font-size: 32px;
      font-weight: 900;
    }
    .scanner-icon::after {
      content: '';
      width: 34px;
      height: 3px;
      position: absolute;
      left: 14px;
      top: 18px;
      border-radius: 99px;
      background: #dcebd6;
      box-shadow: 0 9px 0 #dcebd6, 0 18px 0 #dcebd6;
    }
    .scanner-copy { min-width: 0; text-align: left; }
    .scanner-copy strong { display: block; font-size: clamp(24px, 2.8vw, 34px); line-height: 1.3; }
    .scanner-copy span { display: block; margin-top: 5px; color: var(--muted); font-size: 15px; font-weight: 700; }
    .scanner-direction {
      min-width: 152px;
      padding-left: 14px;
      border-left: 2px solid rgba(102,138,91,.30);
      color: var(--green-dark);
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
    }
    .scanner-direction b {
      display: block;
      margin-top: -2px;
      font-size: clamp(54px, 6vw, 76px);
      font-family: Arial Black, sans-serif;
      line-height: .82;
      transform: scaleX(1.18);
      transform-origin: center;
    }
    .guide-actions { display: grid; gap: 10px; margin-top: 16px; }
    .entry-box {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .code-input {
      width: 100%;
      min-width: 0;
      height: 58px;
      padding: 0 17px;
      border: 2px solid rgba(102,138,91,.30);
      border-radius: 16px;
      color: var(--brown);
      background: #fff;
      font-size: 18px;
      font-weight: 700;
      outline: none;
    }
    .code-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(102,138,91,.12); }
    .entry-submit { min-width: 128px; height: 58px; border: 0; border-radius: 16px; color: #fff; background: var(--green-dark); font-weight: 800; cursor: pointer; }
    .button-row { display: flex; justify-content: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .btn { min-height: 54px; padding: 0 24px; border: 0; border-radius: 16px; color: #fff; background: var(--green); font-weight: 800; cursor: pointer; }
    .btn.light { color: var(--brown); border: 1px solid rgba(91,68,50,.16); background: #fff; }
    .btn:disabled { opacity: .38; cursor: default; }

    .guide-progress { width: min(560px, 100%); margin: 18px auto 0; }
    .guide-progress-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .guide-progress-track { height: 13px; overflow: hidden; border-radius: 999px; background: #eadfce; }
    .guide-progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9ab48d, var(--green)); transition: width .3s ease; }
    .guide-step-card { width: min(620px, 100%); min-height: 160px; margin: 18px auto 0; padding: 22px; border-radius: 20px; background: #f7efe3; text-align: left; display: grid; grid-template-columns: 58px 1fr; gap: 16px; align-items: center; }
    .guide-step-visual { display: none; width: 100%; height: 190px; overflow: hidden; border-radius: 14px; border: 2px solid rgba(102,138,91,.18); background-color: #fff; background-repeat: no-repeat; box-shadow: 0 8px 18px rgba(91,68,50,.10); }
    .guide-step-num { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--green); font-size: 22px; font-weight: 800; }
    .guide-step-title { margin: 0; font-size: clamp(21px, 2.5vw, 30px); }
    .guide-step-text { margin: 8px 0 0; color: var(--muted); font-size: 16px; line-height: 1.7; }

    .footer { display: flex; justify-content: center; align-items: center; gap: 12px; padding-top: 12px; color: var(--muted); font-size: 12px; }
    .sound-btn { border: 1px solid rgba(91,68,50,.16); border-radius: 999px; padding: 8px 13px; background: #fff; color: var(--brown); cursor: pointer; }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .app { min-height: calc(100vh - 16px); padding: 16px; border-radius: 22px; }
      #homeScreen { grid-template-columns: 1fr; gap: 14px; }
      .avatar-panel { min-height: 285px; }
      .avatar { max-height: 300px; }
      .speech { font-size: 14px; padding: 10px 12px; }
      .choice { min-height: 86px; }
      .brand p { display: none; }
    }

    /* 横向きタブレット向け。ブラウザUIで縦幅が変わっても確実に適用する */
    @media (orientation: landscape) and (min-width: 1000px) {
      body { padding: 8px; }
      .app {
        width: 100%;
        height: calc(100vh - 16px);
        height: calc(100dvh - 16px);
        height: calc(var(--viewport-height) - 16px);
        min-height: 0;
        padding: 10px 18px 8px;
        border-radius: 22px;
        position: relative;
        grid-template-rows: 42px minmax(0, 1fr) 0;
      }
      .brand { display: flex; align-items: center; justify-content: center; gap: 16px; }
      .brand h1 { font-size: clamp(20px, 2.1vw, 30px); }
      .brand p { margin: 0; font-size: 12px; }
      #homeScreen {
        grid-template-columns: minmax(270px, 34%) minmax(520px, 66%);
        gap: clamp(18px, 2.5vw, 40px);
        min-height: 0;
        padding: 6px 0;
      }
      .avatar-panel { min-height: 0; height: 100%; border-radius: 20px; }
      .avatar-stage { width: min(88%, 390px); height: calc(100% - 72px); margin-top: 72px; }
      .avatar { width: 100%; max-width: 100%; height: auto; max-height: none; }
      .speech { top: 10px; left: 10px; right: 10px; padding: 9px 12px; font-size: clamp(13px, 1.35vw, 18px); line-height: 1.45; }
      .home-actions { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
      .lead { font-size: clamp(22px, 2.8vw, 38px); line-height: 1.25; }
      .lead-sub { margin-bottom: 2px; font-size: clamp(13px, 1.25vw, 17px); }
      .choice { height: auto; min-height: 96px; padding: 14px 20px; }
      .choice strong { font-size: clamp(20px, 2vw, 28px); }
      #scanScreen, #guideScreen { min-height: 0; padding: 6px 0; }
      .card { width: min(1180px, 100%); height: 100%; max-height: 100%; padding: 12px 24px; overflow: hidden; }
      #scanScreen .card {
        display: grid;
        grid-template-columns: 300px minmax(320px, 1fr);
        grid-template-rows: minmax(0, 1fr);
        column-gap: 26px;
        align-items: center;
      }
      #scanScreen .mini-avatar { grid-column: 1; grid-row: 1; width: min(100%, 280px); height: auto; max-width: 280px; max-height: 100%; margin: 0 auto; align-self: center; }
      .scan-content { grid-column: 2; grid-row: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #scanScreen .message-main { font-size: clamp(24px, 2.7vw, 38px); }
      #scanScreen .progress-shell { margin-top: 12px; }
      #scanScreen .button-row { margin-top: 10px; }
      #guideScreen .card {
        display: grid;
        grid-template-columns: minmax(280px, .72fr) minmax(520px, 1.38fr);
        grid-template-rows: auto minmax(220px, 1fr) auto;
        gap: 8px 28px;
        align-items: center;
        text-align: left;
      }
      #guideTitle { grid-column: 1; grid-row: 1; align-self: end; font-size: clamp(22px, 2.3vw, 34px); text-align: center; }
      #guideScreen .mini-avatar { grid-column: 1; grid-row: 2; height: min(100%, 330px); max-width: 270px; margin: 0 auto; align-self: center; }
      #guideProgress { grid-column: 2; grid-row: 1; width: 100%; margin: 0; align-self: end; }
      #guideStepCard { grid-column: 2; grid-row: 2; width: 100%; min-height: 205px; margin: 0; padding: 18px 22px; align-self: center; grid-template-columns: minmax(180px, 220px) 58px minmax(0, 1fr); }
      .guide-step-visual { display: block; height: 190px; }
      #guideScreen .button-row { grid-column: 1 / 3; grid-row: 3; margin: 0; }
      .btn { min-height: 44px; }
      .footer {
        position: absolute;
        top: 9px;
        right: 16px;
        z-index: 5;
        padding: 0;
      }
      .footer > span { display: none; }
      .sound-btn { padding: 6px 11px; background: rgba(255,255,255,.92); }
    }

    /* 実機想定: 1024×600前後の低解像度・横向き端末 */
    @media (orientation: landscape) and (min-width: 900px) and (max-width: 1199px),
           (orientation: landscape) and (min-width: 900px) and (max-height: 680px) {
      .app { padding: 6px 10px; grid-template-rows: 32px minmax(0, 1fr) 0; }
      .brand { gap: 8px; }
      .brand h1 { font-size: 20px; }
      .brand p { font-size: 10px; }
      #homeScreen { grid-template-columns: minmax(300px, 37%) minmax(0, 63%); gap: 14px; padding: 4px 0; }
      .avatar-stage { width: min(100%, 430px); height: calc(100% - 58px); margin-top: 58px; }
      .avatar { width: 100%; height: auto; max-height: none; }
      .speech { top: 6px; left: 6px; right: 6px; padding: 10px 12px; font-size: 18px; line-height: 1.35; }
      .home-actions { gap: 11px; justify-content: center; }
      .lead { font-size: 32px; line-height: 1.2; }
      .lead-sub { font-size: 14px; line-height: 1.4; }
      .terminal-kicker { margin-bottom: -6px; padding: 5px 13px; font-size: 13px; }
      .scanner-callout { min-height: 116px; padding: 11px 4px; grid-template-columns: 58px minmax(0, 1fr) 154px; gap: 12px; }
      .scanner-icon { width: 56px; height: 56px; border-radius: 13px; }
      .scanner-icon::after { left: 12px; top: 16px; width: 32px; }
      .scanner-copy strong { font-size: 27px; }
      .scanner-copy span { font-size: 14px; }
      .scanner-direction { min-width: 154px; padding-left: 10px; font-size: 17px; }
      .scanner-direction b { margin-top: 0; font-size: 66px; }
      .guide-actions { gap: 9px; margin-top: 18px; }
      .choice { min-height: 82px; padding: 11px 18px; border-radius: 16px; }
      .choice strong { font-size: 24px; }
      .choice span { margin-top: 4px; font-size: 14px; }
      .card { padding: 8px 14px; border-radius: 18px; }
      #guideScreen .card { position: relative; grid-template-columns: minmax(300px, 37%) minmax(0, 63%); grid-template-rows: 54px minmax(0, 1fr); gap: 8px 20px; padding: 12px 18px 70px; }
      #guideTitle { font-size: 31px; line-height: 1.25; }
      #guideScreen .mini-avatar { width: min(100%, 350px); height: auto; max-width: 350px; max-height: 100%; align-self: end; }
      .guide-progress-head { margin-bottom: 8px; font-size: 16px; }
      .guide-progress-track { height: 14px; }
      #guideStepCard { min-height: 230px; padding: 14px 16px; border-radius: 18px; grid-template-columns: 220px 60px minmax(0, 1fr); gap: 14px; }
      .guide-step-visual { display: block; height: 205px; }
      .guide-step-num { width: 60px; height: 60px; font-size: 24px; }
      .guide-step-title { font-size: 29px; line-height: 1.3; }
      .guide-step-text { margin-top: 8px; font-size: 18px; line-height: 1.55; }
      #guideScreen .button-row { position: absolute; left: 12px; right: 12px; bottom: 8px; gap: 10px; }
      .btn { min-height: 48px; padding: 0 18px; border-radius: 13px; font-size: 16px; }
      .sound-btn { padding: 5px 8px; font-size: 10px; }
      #scanScreen .card { grid-template-columns: minmax(300px, 36%) minmax(0, 64%); column-gap: 24px; padding: 16px 24px 12px; }
      #scanScreen .mini-avatar { width: min(100%, 340px); height: auto; max-width: 340px; max-height: 96%; align-self: center; }
      #scanScreen .message-main { font-size: 36px; line-height: 1.35; }
      #scanScreen .message-sub { margin-top: 8px; font-size: 18px; }
      #scanScreen .progress-shell { width: min(560px, 92%); margin-top: 18px; }
      #scanScreen .progress-track { height: 20px; }
      #scanScreen .progress-num { font-size: 34px; }
      #scanScreen .button-row { margin-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar-stage, .avatar-stage .avatar, #guideAvatar, .speech { animation: none !important; }
    }

    .diagnostics-panel {
      display: none;
      position: fixed;
      inset: 12px;
      z-index: 1000;
      overflow: auto;
      padding: 18px;
      border: 2px solid #6f9565;
      border-radius: 16px;
      background: rgba(255, 253, 248, .98);
      color: #4f3b2d;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    .diagnostics-panel.active { display: block; }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <h1>COMPASSION WORLD</h1>
      <p>本館 入店受付</p>
    </header>

    <section id="homeScreen" class="screen active">
      <div class="avatar-panel" aria-label="案内アバター">
        <div id="homeSpeech" class="speech">いらっしゃいませ。<br>会員の方は会員証を提示してください。</div>
        <div id="homeAvatarStage" class="avatar-stage">
          <img class="avatar female" src="assets/avatar-female-tablet.png" alt="女性の案内アバター">
        </div>
      </div>
      <div class="home-actions">
        <div class="terminal-kicker">COMPASSION WORLD 本館</div>
        <h2 class="lead">入店受付端末</h2>
        <p class="lead-sub">会員証を読み取ると、自動で入店受付を行います。</p>
        <div class="scanner-callout" role="status" aria-label="会員証を右側のバーコードリーダーへかざしてください">
          <div class="scanner-icon" aria-hidden="true"></div>
          <div class="scanner-copy">
            <strong>会員証を右側の<br>バーコードリーダーへ</strong>
            <span>読み取り後は自動で入店受付へ進みます。</span>
          </div>

      <div class="card">

  </main>
  <pre id="diagnosticsPanel" class="diagnostics-panel" aria-label="端末診断情報"></pre>

  <script>
    /* URLを書き換えるだけで音声・アバターを交換できます。空文字なら音声は再生しません。 */
    const APP_CONFIG = {
      appVersion: 'entry-web-2026.08.29-shadow-v2',
      workerUrl: 'https://script.google.com/macros/s/AKfycbx7NeJbl472i_GmHpid5E5sUqo-eyGwo9TZ1UhZ45qaoeTYlKCzl6qCl9CI_wnNSvNUew/exec',
      audio: {
        bgm: 'https://wce-06.github.io/liff-entry/audio/bgm.mp3',
        welcome: 'assets/audio/top.mp3',
        memberHelp1: 'assets/audio/member-guide-1.mp3',
        memberHelp2: 'assets/audio/member-guide-2.mp3',
        memberHelp3: 'assets/audio/member-guide-3.mp3',
        firstVisit: '',
        scanning: 'assets/audio/authenticating.mp3',
        success: '',
        retry: ''
      },
      volume: {
        bgmBase: 0.62,
        welcomeBase: 0.55,
        guideBase: 1.0
      },
      welcomeRepeatDelayMs: 10000,
      barcodeQuietDelayMs: 1000,
      barcodeEnterDelayMs: 500,
      entryRequestDelayMs: 2000,
      resetAfterSuccessMs: 20000,
      resetAfterErrorMs: 10000,
      networkRetryDelayMs: 1000
    };

    const SCREENS = ['homeScreen', 'scanScreen', 'guideScreen'];
    const $ = id => document.getElementById(id);
    const codeInput = $('codeInput');
    const isNativeKiosk = /COMPASSION-KIOSK\//.test(navigator.userAgent);
    let isSubmitting = false;
    let audioEnabled = false;
    let currentAudio = null;
    let currentAudioBase = 1;
    let bgmAudio = null;
    let welcomeTimer = null;
    let progressStopper = null;
    let resetTimer = null;
    let scanInputTimer = null;
    let guideScanTimer = null;
    let guideScanBuffer = '';
    let lastCode = '';
    let lastSubmittedAt = 0;
    let activeGuideType = '';
    let guideStepIndex = 0;

    const DIAGNOSTIC_LOG_KEY = 'compassion-entry-diagnostics-v1';
    const DIAGNOSTIC_SESSION_KEY = 'compassion-entry-session-v1';
    let diagnosticSession = null;

    function readDiagnosticLog() {
      try { return JSON.parse(localStorage.getItem(DIAGNOSTIC_LOG_KEY) || '[]'); }
      catch (_) { return []; }
    }

    function recordDiagnostic(type, detail = {}) {
      try {
        const log = readDiagnosticLog();
        log.push({ at: new Date().toISOString(), type, detail });
        localStorage.setItem(DIAGNOSTIC_LOG_KEY, JSON.stringify(log.slice(-30)));
      } catch (_) {}
      renderDiagnostics();
    }

    function renderDiagnostics() {
      const panel = $('diagnosticsPanel');
      if (!panel || !new URLSearchParams(location.search).has('diagnostics')) return;
      const log = readDiagnosticLog();
      const recent = log.slice(-12);
      const appError = recent.some(item => item.type === 'javascript_error' || item.type === 'promise_error');
      const interrupted = recent.some(item => item.type === 'previous_session_interrupted');
      let verdict = '現在、異常終了の記録はありません。';
      if (appError) verdict = 'アプリ側のJavaScriptエラーが記録されています。';
      else if (interrupted) verdict = 'JavaScriptエラーなしで前回の動作が中断されました。端末・OS・ブラウザ側で終了した可能性が高い状態です。';
      panel.classList.add('active');
      panel.textContent = [
        'COMPASSION WORLD 端末診断',
        '',
        `判定: ${verdict}`,
        `画面: ${window.innerWidth} x ${window.innerHeight}`,
        `端末メモリ目安: ${navigator.deviceMemory || '取得不可'} GB`,
        `ブラウザ: ${navigator.userAgent}`,
        '',
        '直近の記録:',
        JSON.stringify(recent, null, 2),
        '',
        '通常画面へ戻る場合はURL末尾の ?diagnostics=1 を削除してください。'
      ].join('\n');
    }

    function startDiagnostics() {
      try {
        const previous = JSON.parse(localStorage.getItem(DIAGNOSTIC_SESSION_KEY) || 'null');
        if (previous && !previous.clean && Date.now() - previous.heartbeat < 10 * 60 * 1000) {
          recordDiagnostic('previous_session_interrupted', { lastHeartbeat: previous.heartbeat });
        }
        diagnosticSession = { id: `${Date.now()}-${Math.random()}`, clean: false, heartbeat: Date.now() };
        localStorage.setItem(DIAGNOSTIC_SESSION_KEY, JSON.stringify(diagnosticSession));
        setInterval(() => {
          if (!diagnosticSession) return;
          diagnosticSession.heartbeat = Date.now();
          localStorage.setItem(DIAGNOSTIC_SESSION_KEY, JSON.stringify(diagnosticSession));
        }, 5000);
      } catch (_) {}
      renderDiagnostics();
    }

    window.addEventListener('error', event => {
      recordDiagnostic('javascript_error', { message: event.message, file: event.filename, line: event.lineno });
    });
    window.addEventListener('unhandledrejection', event => {
      recordDiagnostic('promise_error', { message: String(event.reason && event.reason.message || event.reason || 'unknown') });
    });
    window.addEventListener('pagehide', () => {
      if (!diagnosticSession) return;
      diagnosticSession.clean = true;
      diagnosticSession.heartbeat = Date.now();
      try { localStorage.setItem(DIAGNOSTIC_SESSION_KEY, JSON.stringify(diagnosticSession)); } catch (_) {}
    });

    const GUIDES = {
      member: {
        title: '会員証の表示方法',
        text: 'スマートフォンで会員証を開き、表示されたバーコードを右側のリーダーへかざしてください。',
        avatar: 'assets/avatar-female-tablet.png',
        audio: 'memberHelp1',
        steps: [
          ['1', '公式LINEを開く', 'トーク画面下部の「通行許可証」をタップします', { image: 'assets/guide-member-1.jpg', size: 'contain', position: 'center', audio: 'memberHelp1' }],
          ['2', '会員証を表示', '通行許可証・住民登録証のバーコードを表示します', { image: 'assets/guide-member-2.jpg', size: 'contain', position: 'center', audio: 'memberHelp2' }],
          ['3', 'バーコードをかざす', 'この画面のまま、右側のリーダーへかざしてください。読み取り後、自動で認証を開始します', { image: 'assets/guide-member-3.jpg', size: 'contain', position: 'center', audio: 'memberHelp3' }]
        ]
      },
      first: {
        title: '初めてご利用の方へ',
        text: '新しいCOMPASSION WORLDポイントカードを、スマートフォンから登録できます。',
        avatar: 'assets/avatar-male-tablet-v2.png',
        audio: 'firstVisit',
        steps: [
          ['1', '二次元バーコードを読み取る', 'スマートフォンのカメラで読み取ってください。LINEの登録画面が開きます', { image: 'assets/guide-first-registration-qr.svg', size: 'contain', position: 'center' }],
          ['2', '「同意する」をタップ', 'LINEの確認画面で「同意する」をタップします', { image: 'assets/guide-first-2.jpg', size: 'contain', position: 'center' }],
          ['3', '「許可する」をタップ', 'プロフィール情報の利用を確認し、「許可する」をタップします', { image: 'assets/guide-first-3.jpg', size: 'contain', position: 'center' }],
          ['4', 'お客さま情報を入力', '画面の案内に沿って必要情報を入力し、登録を完了します', { image: 'assets/guide-first-4.jpg', size: 'contain', position: 'center' }],
          ['5', '会員証をリーダーへかざす', '発行された会員証の二次元バーコードを、右側のリーダーへかざしてください', { image: 'assets/guide-first-new-card-qr.svg', size: 'contain', position: 'center' }]
        ]
      }
    };

    function showScreen(id) {
      SCREENS.forEach(screenId => $(screenId).classList.toggle('active', screenId === id));
      if (id === 'guideScreen') stopAudio();
      focusScanner();
    }

    function focusScanner(selectValue = false) {
      if (!$('homeScreen').classList.contains('active')) return;
      codeInput.disabled = false;
      codeInput.readOnly = false;
      if (isNativeKiosk) {
        codeInput.blur();
        return;
      }
      requestAnimationFrame(() => {
        try { codeInput.focus({ preventScroll: true }); } catch (_) { codeInput.focus(); }
        if (selectValue && codeInput.value) codeInput.select();
      });
    }

    function normalizeCode(value) {
      return String(value || '')
        .normalize('NFKC')
        .trim()
        .replace(/[\r\n\s]+/g, '')
        .toUpperCase()
        .replace(/[^0-9A-Z-]/g, '');
    }

    function asciiFromPhysicalKey(event) {
      const code = String(event.code || '');
      if (/^Key[A-Z]$/.test(code)) return code.slice(3);
      if (/^Digit[0-9]$/.test(code)) return code.slice(5);
      if (/^Numpad[0-9]$/.test(code)) return code.slice(6);
      if (code === 'Minus' || code === 'NumpadSubtract') return '-';
      return '';
    }

    function getMasterVolume(date = new Date()) {
      const hour = date.getHours();
      if (hour < 2) return 0.30;
      if (hour < 8) return 0.01;
      if (hour < 9) return 0.75;
      if (hour < 18) return 1.00;
      if (hour < 21) return 0.75;
      return 0.50;
    }

    function updateScheduledVolumes() {
      const master = getMasterVolume();
      if (bgmAudio) bgmAudio.volume = Math.min(1, APP_CONFIG.volume.bgmBase * master);
      if (currentAudio) currentAudio.volume = Math.min(1, currentAudioBase * master);
      if (audioEnabled) $('soundBtn').textContent = `🔊 音声ON ${Math.round(master * 100)}%`;
    }

    function stopAudio() {
      clearTimeout(welcomeTimer);
      welcomeTimer = null;
      const stage = $('homeAvatarStage');
      const guideAvatar = $('guideAvatar');
      if (stage) stage.classList.remove('speaking');
      if (guideAvatar) guideAvatar.classList.remove('speaking');
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    async function playGuide(key) {
      if (!audioEnabled) return;
      const url = APP_CONFIG.audio[key];
      if (!url) return;
      stopAudio();
      currentAudio = new Audio(url);
      currentAudio.preload = 'auto';
      currentAudioBase = key === 'welcome' ? APP_CONFIG.volume.welcomeBase : APP_CONFIG.volume.guideBase;
      currentAudio.volume = Math.min(1, currentAudioBase * getMasterVolume());
      const stage = $('homeAvatarStage');
      const guideAvatar = $('guideAvatar');
      const setSpeaking = active => {
        if (stage) stage.classList.toggle('speaking', active);
        if (guideAvatar) guideAvatar.classList.toggle('speaking', active);
      };
      currentAudio.addEventListener('play', () => setSpeaking(true));
      currentAudio.addEventListener('ended', () => {
        setSpeaking(false);
        currentAudio = null;
        if (key === 'welcome' && $('homeScreen').classList.contains('active')) {
          scheduleWelcome(APP_CONFIG.welcomeRepeatDelayMs);
        }
      });
      currentAudio.addEventListener('pause', () => setSpeaking(false));
      try { await currentAudio.play(); } catch (_) { setSpeaking(false); }
    }

    function scheduleWelcome(delay = APP_CONFIG.welcomeRepeatDelayMs) {
      clearTimeout(welcomeTimer);
      welcomeTimer = null;
      if (!audioEnabled || !$('homeScreen').classList.contains('active')) return;
      welcomeTimer = setTimeout(() => {
        if ($('homeScreen').classList.contains('active')) playGuide('welcome');
      }, delay);
    }

    async function enableAudio() {
      audioEnabled = true;
      if (!bgmAudio && APP_CONFIG.audio.bgm) {
        bgmAudio = new Audio(APP_CONFIG.audio.bgm);
        bgmAudio.loop = true;
        bgmAudio.preload = 'auto';
      }
      updateScheduledVolumes();
      if (bgmAudio) {
        try { await bgmAudio.play(); } catch (_) {}
      }
      await playGuide('welcome');
      focusScanner();
    }

    function renderGuideStep() {
      const guide = GUIDES[activeGuideType];
      if (!guide) return;
      const step = guide.steps[guideStepIndex];
      const total = guide.steps.length;
      const percent = Math.round(((guideStepIndex + 1) / total) * 100);
      $('guideStepNum').textContent = step[0];
      $('guideStepTitle').textContent = step[1];
      $('guideStepText').textContent = step[2];
      const visual = step[3];
      const visualEl = $('guideStepVisual');
      visualEl.style.backgroundImage = visual ? `url("${visual.image}")` : 'none';
      visualEl.style.backgroundSize = visual ? visual.size : 'cover';
      visualEl.style.backgroundPosition = visual ? visual.position : 'center';
      visualEl.setAttribute('aria-label', visual ? `${step[1]}の操作画面` : '');
      $('guideReplayBtn').dataset.audioKey = visual && visual.audio ? visual.audio : guide.audio;
      $('guideProgressLabel').textContent = `ステップ ${guideStepIndex + 1} / ${total}`;
      $('guideProgressPercent').textContent = `${percent}%`;
      $('guideProgressFill').style.width = `${percent}%`;
      $('guidePrevBtn').disabled = guideStepIndex === 0;
      $('guideNextBtn').textContent = guideStepIndex === total - 1 ? '案内を終了' : '次へ';
    }

    function openGuide(type) {
      const guide = GUIDES[type];
      activeGuideType = type;
      guideStepIndex = 0;
      $('guideTitle').textContent = guide.title;
      $('guideAvatar').src = guide.avatar;
      renderGuideStep();
      showScreen('guideScreen');
      playGuide($('guideReplayBtn').dataset.audioKey);
    }

    function moveGuideStep(delta) {
      const guide = GUIDES[activeGuideType];
      if (!guide) return;
      const nextIndex = guideStepIndex + delta;
      if (nextIndex >= guide.steps.length) {
        resetHome();
        return;
      }
      guideStepIndex = Math.max(0, nextIndex);
      renderGuideStep();
      playGuide($('guideReplayBtn').dataset.audioKey);
    }

    function startProgress() {
      if (progressStopper) progressStopper(false);
      let percent = 0;
      $('progressShell').style.display = '';
      $('progressFill').style.width = '0%';
      $('progressNum').textContent = '0%';
      const timer = setInterval(() => {
        percent = Math.min(percent + 1, 90);
        $('progressFill').style.width = `${percent}%`;
        $('progressNum').textContent = `${percent}%`;
      }, 80);
      progressStopper = complete => {
        clearInterval(timer);
        $('progressFill').style.width = complete ? '100%' : '0%';
        $('progressNum').textContent = complete ? '100%' : '0%';
      };
      return progressStopper;
    }

    function resetHome() {
      clearTimeout(resetTimer);
      if (progressStopper) progressStopper(false);
      progressStopper = null;
      isSubmitting = false;
      codeInput.value = '';
      $('spinner').style.display = 'none';
      $('successMark').style.display = 'none';
      $('messageMain').textContent = '会員証をスキャンしてください';
      $('messageSub').textContent = '右側のバーコードリーダーへかざしてください。';
      $('messageSub').classList.remove('error-note');
      showScreen('homeScreen');
      scheduleWelcome();
      setTimeout(() => focusScanner(true), 80);
    }

    function scheduleReset(ms) {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(resetHome, ms);
    }

    async function postJson(url, body) {
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        if (!response.ok) return { ok: false, error: `http_${response.status}` };
        try { return await response.json(); } catch (_) { return { ok: false, error: 'invalid_json' }; }
      } catch (error) {
        return { ok: false, error: 'network_error', detail: String(error && error.message || error) };
      }
    }

    function isCommunicationError(result) {
      const error = String(result && result.error || '');
      return !result || ['network_error', 'invalid_json', 'request_timeout'].includes(error) || error.startsWith('http_');
    }

    function errorMessage(reason) {
      if (reason === 'customer_not_found') return ['会員情報を確認できませんでした', '会員登録または会員証の表示をご確認ください。'];
      if (reason === 'invalid_member_code') return ['会員証を確認できませんでした', '会員証のコードをもう一度スキャンしてください。'];
      if (reason === 'rank_not_allowed') return ['入店資格を確認できませんでした', '会員情報をご確認のうえ、もう一度お試しください。'];
      if (reason === 'door_trigger_failed') return ['ドアの開錠に失敗しました', '通信状態を確認して、もう一度お試しください。'];
      if (['server_error', 'configuration_error', 'token_error'].includes(reason)) return ['ただいま認証サービスを確認しています', '会員証の問題ではありません。少し時間をあけて、もう一度お試しください。'];
      if (['network_error', 'invalid_json', 'request_timeout'].includes(reason) || String(reason).startsWith('http_')) {
        return ['通信に失敗しました', '少し時間をあけて、もう一度お試しください。'];
      }
      return ['うまく読み取れませんでした', '画面を明るくし、バーコードをリーダーへまっすぐかざしてください。'];
    }

    function showError(reason) {
      if (progressStopper) progressStopper(false);
      progressStopper = null;
      $('spinner').style.display = 'none';
      $('successMark').style.display = 'none';
      $('progressShell').style.display = '';
      const [main, sub] = errorMessage(reason || 'unknown');
      $('messageMain').textContent = main;
      $('messageSub').textContent = sub;
      $('messageSub').classList.add('error-note');
      playGuide('retry');
      scheduleReset(APP_CONFIG.resetAfterErrorMs);
    }

    function showSuccess(customerCode) {
      if (progressStopper) progressStopper(true);
      progressStopper = null;
      $('progressShell').style.display = 'none';
      $('spinner').style.display = 'none';
      $('successMark').style.display = 'block';
      $('messageMain').textContent = 'ゲートが開きます';
      $('messageSub').textContent = 'お足元に気をつけてお進みください。';
      $('messageSub').classList.remove('error-note');
      playGuide('success');
      scheduleReset(APP_CONFIG.resetAfterSuccessMs);
    }

    function createRequestId(){
      if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID();
      const bytes=new Uint8Array(16);
      if(window.crypto&&typeof window.crypto.getRandomValues==='function')window.crypto.getRandomValues(bytes);
      else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
      bytes[6]=(bytes[6]&0x0f)|0x40;
      bytes[8]=(bytes[8]&0x3f)|0x80;
      const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0'));
      return hex.slice(0,4).join('')+'-'+hex.slice(4,6).join('')+'-'+hex.slice(6,8).join('')+'-'+hex.slice(8,10).join('')+'-'+hex.slice(10).join('');
    }

    function sendShadowComparison(requestId,customerCode,result){if(!result||isCommunicationError(result))return;const legacyAllowed=Boolean(result.ok||(result.isMember&&result.reason==='door_trigger_failed'));postJson(APP_CONFIG.workerUrl,{action:'shadow_compare',requestId:requestId,customerCode:customerCode,legacyAllowed:legacyAllowed,legacyReason:result.reason||result.error||'',legacyRank:result.rank||'',appVersion:APP_CONFIG.appVersion}).catch(()=>{});}

    async function submitCode(raw) {
      const customerCode = normalizeCode(raw);
      if (!customerCode || isSubmitting) return;
      if (!/^[0-9A-Z]{10}$/.test(customerCode)) { showError('invalid_member_code'); return; }
      const requestId = createRequestId();
      const now = Date.now();
      if (customerCode === lastCode && now - lastSubmittedAt < 2000) return;
      lastCode = customerCode;
      lastSubmittedAt = now;
      isSubmitting = true;
      showScreen('scanScreen');
      $('messageMain').textContent = 'お客さま情報を照会しています';
      $('messageSub').textContent = '確認が完了するとゲートが自動で開きます。';
      $('messageSub').classList.remove('error-note');
      playGuide('scanning');
      startProgress();

      await new Promise(r => setTimeout(r, APP_CONFIG.entryRequestDelayMs));

      let result = await postJson(APP_CONFIG.workerUrl, { action: 'entry_check', customerCode, requestId });
      sendShadowComparison(requestId, customerCode, result);
      if (result && result.ok) { showSuccess(customerCode); return; }
      if (result && result.isMember && result.reason === 'door_trigger_failed') { showSuccess(customerCode); return; }
      if (!isCommunicationError(result)) { showError(result.reason || result.error); return; }

      /* 応答だけ失われてもGAS側で認証・開錠が完了している場合がある。
         二重開錠を避けるため再送せず、受付済みとして完了画面へ進む。 */
      showSuccess(customerCode);
    }

    $('memberHelpBtn').addEventListener('click', () => openGuide('member'));
    $('firstVisitBtn').addEventListener('click', () => openGuide('first'));
    $('guidePrevBtn').addEventListener('click', () => moveGuideStep(-1));
    $('guideNextBtn').addEventListener('click', () => moveGuideStep(1));
    $('guideReplayBtn').addEventListener('click', e => playGuide(e.currentTarget.dataset.audioKey));
    $('guideBackBtn').addEventListener('click', resetHome);
    $('scanBackBtn').addEventListener('click', resetHome);
    $('soundBtn').addEventListener('click', enableAudio);
    $('submitCodeBtn').addEventListener('click', () => {
      submitCode(codeInput.value);
      codeInput.value = '';
    });
    function scheduleHomeScan(delay = APP_CONFIG.barcodeQuietDelayMs) {
      clearTimeout(scanInputTimer);
      if (codeInput.value.length < 3) return;
      scanInputTimer = setTimeout(() => {
        const scannedCode = codeInput.value;
        codeInput.value = '';
        submitCode(scannedCode);
      }, delay);
    }

    window.receiveNativeBarcode = rawCode => {
      clearTimeout(scanInputTimer);
      clearTimeout(guideScanTimer);
      guideScanBuffer = '';
      const scannedCode = normalizeCode(rawCode);
      if (scannedCode.length < 3) return;
      codeInput.value = '';
      submitCode(scannedCode);
    };

    codeInput.addEventListener('beforeinput', event => {
      if (event.inputType === 'insertCompositionText') event.preventDefault();
    });
    codeInput.addEventListener('compositionstart', () => {
      codeInput.value = normalizeCode(codeInput.value);
    });
    codeInput.addEventListener('compositionend', () => {
      codeInput.value = normalizeCode(codeInput.value);
      scheduleHomeScan();
    });
    codeInput.addEventListener('input', () => {
      codeInput.value = normalizeCode(codeInput.value);
      scheduleHomeScan();
    });
    codeInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.code === 'Enter' || event.code === 'NumpadEnter') {
        event.preventDefault();
        event.stopPropagation();
        scheduleHomeScan(APP_CONFIG.barcodeEnterDelayMs);
        return;
      }
      const ascii = asciiFromPhysicalKey(event);
      if (!ascii) return;
      event.preventDefault();
      event.stopPropagation();
      codeInput.value = normalizeCode(codeInput.value + ascii);
      scheduleHomeScan();
    }, true);
    function isMemberScanStep() {
      return $('guideScreen').classList.contains('active') &&
        activeGuideType === 'member' &&
        guideStepIndex === GUIDES.member.steps.length - 1;
    }
    function finishGuideScan() {
      clearTimeout(guideScanTimer);
      const scannedCode = normalizeCode(guideScanBuffer);
      guideScanBuffer = '';
      if (scannedCode.length < 3) return;
      codeInput.value = scannedCode;
      submitCode(scannedCode);
    }
    document.addEventListener('keydown', event => {
      if (!isMemberScanStep() || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.key === 'Enter') {
        event.preventDefault();
        event.stopPropagation();
        clearTimeout(guideScanTimer);
        guideScanTimer = setTimeout(finishGuideScan, APP_CONFIG.barcodeEnterDelayMs);
        return;
      }
      const ascii = asciiFromPhysicalKey(event);
      if (!ascii && event.key.length !== 1) return;
      event.preventDefault();
      event.stopPropagation();
      guideScanBuffer += ascii || event.key;
      clearTimeout(guideScanTimer);
      guideScanTimer = setTimeout(finishGuideScan, APP_CONFIG.barcodeQuietDelayMs);
    }, true);
    function updateViewportHeight() {
      document.documentElement.style.setProperty('--viewport-height', `${window.innerHeight}px`);
    }
    updateViewportHeight();
    window.addEventListener('resize', updateViewportHeight);
    window.addEventListener('orientationchange', updateViewportHeight);
    setInterval(updateScheduledVolumes, 60000);
    startDiagnostics();
    window.addEventListener('load', () => {
      updateViewportHeight();
      resetHome();
      renderDiagnostics();
      enableAudio();
    });
    document.addEventListener('pointerdown', () => {
      if (!bgmAudio || bgmAudio.paused) enableAudio();
    }, { once: true });
    window.addEventListener('pageshow', () => { focusScanner(true); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) focusScanner(true);
    });
    window.addEventListener('click', event => {
      if (!['BUTTON', 'INPUT'].includes(event.target.tagName)) focusScanner();
    });
  </script>
</body>
</html>
